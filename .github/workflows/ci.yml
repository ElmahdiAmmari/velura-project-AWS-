name: CI/CD Velura Production Pipeline

on:
  push:
    branches: [ "main", "mista" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1 : Détection intelligente des fichiers modifiés
  detect-changes:
    name: Check Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      catalog: ${{ steps.filter.outputs.catalog }}
      rental: ${{ steps.filter.outputs.rental }}
      admin: ${{ steps.filter.outputs.admin }}
      frontend: ${{ steps.filter.outputs.frontend }}
      filebeat: ${{ steps.filter.outputs.filebeat }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'services/auth/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            catalog:
              - 'services/catalog/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            rental:
              - 'services/rental/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'services/admin/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            filebeat:
              - 'infra/docker/filebeat-image/**'
              - '.github/workflows/ci.yml'

  # JOB 2 : Qualité de code Python
  linting:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linters
        run: pip install flake8

      - name: Run Syntax Check (Flake8)
        run: flake8 services/ shared/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 3 : Tests unitaires et de sécurité isolés (Mock Database)
  backend-tests:
    name: Security & Functional Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/auth/requirements.txt pytest

      - name: Run Security Tests via Pytest
        env:
          AUTH_SERVICE_PORT: "5001"
          JWT_SECRET_KEY: "ci_safety_key_override"
          FLASK_DEBUG: "false"
          FLASK_ENV: "testing"
          DB_HOST: "127.0.0.1"
          DB_USER: "test_user"
          DB_PASSWORD: "test_password"
          DB_NAME: "clothes_auth"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_USER: "test_user"
          MYSQL_PASSWORD: "test_password"
          MYSQL_DATABASE: "clothes_auth"
          MYSQL_PORT: "3306"
        run: |
          PYTHONPATH=.:services/auth pytest services/auth/tests/ -v

  # JOB 4 : Construction parallèle, Analyse Trivy et Livraison ECR (us-east-1)
  build-and-deploy:
    name: Build & Scan - ${{ matrix.service }}
    needs: [detect-changes, linting, backend-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: .
            file: services/auth/Dockerfile
            image_name: clothes-auth-service
            run_build: ${{ needs.detect-changes.outputs.auth }}
            trivy_exit_code: '1' # Strict
          - service: catalog
            context: .
            file: services/catalog/Dockerfile
            image_name: clothes-catalog-service
            run_build: ${{ needs.detect-changes.outputs.catalog }}
            trivy_exit_code: '1' # Strict
          - service: rental
            context: .
            file: services/rental/Dockerfile
            image_name: clothes-rental-service
            run_build: ${{ needs.detect-changes.outputs.rental }}
            trivy_exit_code: '1' # Strict
          - service: admin
            context: .
            file: services/admin/Dockerfile
            image_name: clothes-admin-service
            run_build: ${{ needs.detect-changes.outputs.admin }}
            trivy_exit_code: '1' # Strict
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
            image_name: clothes-frontend
            run_build: ${{ needs.detect-changes.outputs.frontend }}
            trivy_exit_code: '1' # Strict
          - service: filebeat
            context: infra/docker/filebeat-image
            file: infra/docker/filebeat-image/Dockerfile
            image_name: clothes-filebeat
            run_build: ${{ needs.detect-changes.outputs.filebeat }}
            trivy_exit_code: '0' # Non-bloquant pour l'outil tiers Elastic

    steps:
      - name: Checkout Code
        if: matrix.run_build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.run_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: matrix.run_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image_name }}:${{ github.sha }}
          build-args: |
            AUTH_URL=http://clothes-alb-201777499.us-east-1.elb.amazonaws.com/auth
            CATALOG_URL=http://clothes-alb-201777499.us-east-1.elb.amazonaws.com/catalog
            RENTAL_URL=http://clothes-alb-201777499.us-east-1.elb.amazonaws.com/rental
            ADMIN_URL=http://clothes-alb-201777499.us-east-1.elb.amazonaws.com/admin
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: CyberSecurity Scan (Trivy)
        if: matrix.run_build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.image_name }}:${{ github.sha }}'
          format: 'table'
          exit-code: ${{ matrix.trivy_exit_code }}
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS Credentials
        if: matrix.run_build == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.run_build == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to AWS ECR
        if: matrix.run_build == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ${{ matrix.image_name }}:$IMAGE_TAG $ECR_REGISTRY/${{ matrix.image_name }}:$IMAGE_TAG
          docker tag ${{ matrix.image_name }}:$IMAGE_TAG $ECR_REGISTRY/${{ matrix.image_name }}:latest
          docker push -a $ECR_REGISTRY/${{ matrix.image_name }}

  # JOB 5 : Ordonnancement du déploiement séquentiel sur le cluster AWS ECS
  deploy-to-production:
    name: Trigger AWS ECS Rolling Update
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Exécuté une seule fois en fin de pipeline pour éviter le spam d'API et le Rate Limiting AWS
      - name: Force ECS Deployment with New Artifacts
        run: |
          aws ecs update-service --cluster clothes-cluster --service clothes-auth --force-new-deployment
          aws ecs update-service --cluster clothes-cluster --service clothes-catalog --force-new-deployment
          aws ecs update-service --cluster clothes-cluster --service clothes-rental --force-new-deployment
          aws ecs update-service --cluster clothes-cluster --service clothes-admin --force-new-deployment
          aws ecs update-service --cluster clothes-cluster --service clothes-frontend --force-new-deployment